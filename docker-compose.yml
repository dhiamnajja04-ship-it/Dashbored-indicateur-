# =====================================================================
# Lancement manuel de toute la plateforme sur UNE machine (dev / test).
#
#   docker compose up -d --build
#
# ATTENTION — ce fichier n'est PAS le déploiement de production.
# Il conteneurise PostgreSQL par commodité, alors que la consigne du stage
# impose un serveur PostgreSQL externe. En production, c'est k8s/ qui fait foi,
# et le service « postgres » ci-dessous n'existe pas : la connexion pointe vers
# le serveur du tuteur via le Secret Kubernetes.
#
# Utilité de ce fichier : reproduire la chaîne complète en une commande, pour
# développer et tester sans cluster.
# =====================================================================

services:
  postgres:
    image: postgres:17
    container_name: indic-postgres
    environment:
      POSTGRES_PASSWORD: testpwd
      POSTGRES_DB: indicateurs_db
    ports:
      - "15432:5432"
    volumes:
      # Exécutés une seule fois, dans l'ordre alphabétique, au premier démarrage :
      # dump initial, puis migration, puis données de démonstration.
      - ./db/00-schema-initial.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./db/01-migration-alignement.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
      - ./db/02-donnees-demo.sql:/docker-entrypoint-initdb.d/02-demo.sql:ro
      - ./db/03-reclamations.sql:/docker-entrypoint-initdb.d/03-reclamations.sql:ro
      - ./db/04-localisation.sql:/docker-entrypoint-initdb.d/04-localisation.sql:ro
      - ./db/05-documents-et-utilisateurs.sql:/docker-entrypoint-initdb.d/05-documents.sql:ro
      - ./db/06-indicateurs-complementaires.sql:/docker-entrypoint-initdb.d/06-indicateurs.sql:ro
      - ./db/07-organisations-et-periodes.sql:/docker-entrypoint-initdb.d/07-referentiels.sql:ro
      - ./db/08-cascades.sql:/docker-entrypoint-initdb.d/08-cascades.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indicateurs_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  metier-service:
    build: ./MetierService
    container_name: indic-metier
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=indicateurs_db;Username=postgres;Password=testpwd"
      ASPNETCORE_ENVIRONMENT: Production
      Stockage__Documents: "/donnees/documents"
    volumes:
      # Les fichiers deposes vivent sur un volume : ils survivent a la
      # reconstruction de l'image du service metier.
      - documents-data:/donnees/documents
    depends_on:
      postgres:
        condition: service_healthy
    # Pas de ports: exposés — comme en Kubernetes, le métier n'est joignable
    # que depuis l'intérieur du réseau, via le Gateway.

  ollama:
    image: ollama/ollama:latest
    container_name: indic-ollama
    environment:
      # Une seule génération et un seul modèle chargés à la fois : sur 4 cœurs,
      # deux inférences simultanées rendent la machine inutilisable.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Modele garde resident : les mesures ont montre que le cout dominant
      # etait le chargement a froid du modele, pas la generation elle-meme.
      OLLAMA_KEEP_ALIVE: "-1"
    deploy:
      resources:
        limits:
          # Aligné sur k8s/20-ollama.yaml, qui plafonne déjà ollama. Sans cette
          # limite, ollama prend les 4 cœurs de la VM pendant toute la génération
          # et l'interface graphique gèle — ce qui ressemble à un plantage.
          # 2 cœurs et non 3 : la valeur doit rester valide sur une machine
          # à 2 processeurs, sinon Docker refuse de créer le conteneur et
          # TOUTE la pile échoue — ia-service dépendant d'ollama. C'est ce qui
          # cassait le pipeline, dont le runner n'a que 2 cœurs.
          # Sur la VM de développement (4 cœurs), il en reste 2 pour le
          # système : l'interface graphique ne gèle plus pendant une
          # génération, ce qui était l'objectif initial de cette limite.
          cpus: "2"
          memory: 6G
    ports:
      # Publie pour que le cluster Kubernetes (kind) puisse joindre le modèle
      # depuis l'extérieur du réseau Compose.
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Le modèle se télécharge une fois, après le démarrage :
    #   docker compose exec ollama ollama pull qwen2.5:0.5b
    # Il persiste ensuite dans le volume ollama-data.

  ia-service:
    build: ./IaService
    container_name: indic-ia
    environment:
      MetierServiceUrl: "http://metier-service:8080/api/indicators/"
      Ollama__BaseUrl: "http://ollama:11434"
      # Qwen2.5 0.5B : modèle open source (Apache 2.0) téléchargé et exécuté en
      # local, comme l'impose le sujet. Retenu à la place de Mistral 7B car la
      # VM n'a que 4 cœurs : Mistral ne terminait pas dans les 200 s du Gateway
      # et saturait le processeur (charge > 8), rendant la machine inutilisable.
      # Mistral reste dans le volume ollama-data : revenir en arrière = 1 ligne.
      Ollama__Model: "qwen2.5:1.5b"
      Ollama__TimeoutSeconds: "180"
      # Le temps de génération est proportionnel au nombre de jetons produits.
      # 512 laisse la place à une synthèse complète sans troncature ; avec un
      # modèle 0.5B cela reste de l'ordre de la dizaine de secondes.
      Ollama__MaxTokens: "512"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      - metier-service
      - ollama
    # Aucune variable de connexion PostgreSQL ici : l'IA passe obligatoirement
    # par le service métier, qui filtre les valeurs non validées.

  gateway:
    build: ./GatewayService
    # Pas de container_name : il empêcherait la réplication, Docker exigeant
    # un nom unique par conteneur. Les répliques sont nommées rw9980-gateway-1,
    # rw9980-gateway-2, etc.
    environment:
      MetierServiceUrl: "http://metier-service:8080/api/indicators"
      IaServiceUrl: "http://ia-service:8080/api/ia"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      - metier-service
      - ia-service

  # Répartiteur de charge devant les répliques du Gateway. Il expose le port
  # 5169 que le Gateway occupait seul auparavant : rien ne change pour les
  # clients (Postman, curl, frontend), mais le point unique de défaillance
  # disparaît.
  loadbalancer:
    image: nginx:1.27-alpine
    container_name: indic-loadbalancer
    ports:
      - "5169:80"
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway

  frontend:
    build: .
    container_name: indic-frontend
    ports:
      - "8080:80"
    depends_on:
      - gateway

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: indic-pgadmin
    environment:
      # Identifiants de l'interface pgAdmin elle-meme (pas ceux de PostgreSQL).
      PGADMIN_DEFAULT_EMAIL: "admin@pictorsolution.tn"
      PGADMIN_DEFAULT_PASSWORD: "admin"
      # Evite l'ecran de bienvenue : on va droit aux tables.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    ports:
      - "5050:80"
    volumes:
      # Connexion a la base deja enregistree : rien a saisir a la premiere
      # ouverture, sinon le releveur doit connaitre l'hote, le port et la base.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgadmin-data:
  documents-data:
  postgres-data:
  ollama-data:
