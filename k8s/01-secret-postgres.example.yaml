# MODÈLE — NE JAMAIS COMMITER LE VRAI SECRET.
#
# PostgreSQL est un serveur externe : il ne tourne PAS dans le cluster
# (contrainte du stage). Seule la chaîne de connexion est injectée dans le pod
# métier, via ce Secret.
#
# Création du vrai secret sur la VM (ne laisse pas la commande dans l'historique
# du shell : préfixe-la d'un espace) :
#
#   kubectl -n indicateurs create secret generic postgres-secret \
#     --from-literal=connection-string="Host=<IP_POSTGRES>;Port=5432;Database=<BASE>;Username=<USER>;Password=<MOT_DE_PASSE>"
#
# Vérification :
#   kubectl -n indicateurs get secret postgres-secret -o jsonpath='{.data.connection-string}' | base64 -d
#
# Ce fichier .example sert uniquement de documentation : les valeurs ci-dessous
# sont fictives.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: indicateurs
type: Opaque
stringData:
  connection-string: "Host=A_COMPLETER;Port=5432;Database=A_COMPLETER;Username=A_COMPLETER;Password=A_COMPLETER"
