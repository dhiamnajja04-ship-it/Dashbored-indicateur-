apiVersion: apps/v1
kind: Deployment
metadata:
  name: metier-service
  namespace: indicateurs
  labels:
    app: metier-service
spec:
  replicas: 1
  strategy:
    # maxUnavailable 0 : un nouveau pod doit être PRÊT avant qu'un ancien
    # disparaisse. Sans cela, un redéploiement peut réduire temporairement la
    # capacité et provoquer des refus de connexion sous charge.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: metier-service
  template:
    metadata:
      labels:
        app: metier-service
    spec:
      # Doit dépasser la durée du preStop, sinon Kubernetes tue le pod
      # avant qu'il ait fini de se retirer proprement.
      terminationGracePeriodSeconds: 30
      containers:
        - name: metier
          image: indicateurs/metier:1.0
          # Images construites localement dans le démon Docker de Minikube :
          # sans Never, k8s tenterait de les tirer d'un registre distant.
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # La chaîne de connexion vient du Secret, jamais du dépôt Git.
            # Le double underscore est la convention .NET pour ConnectionStrings:DefaultConnection.
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: connection-string
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          # Arrêt en douceur. Sans ce délai, Kubernetes retire le pod des
          # endpoints du Service ET le termine quasi simultanément : les
          # connexions déjà ouvertes sont coupées net. Mesuré avant
          # correction : 4 erreurs sur 381 113 requêtes pendant la suppression
          # d'un pod sous charge.
          #
          # Le preStop laisse le temps à kube-proxy de propager le retrait
          # avant que le processus ne commence à s'arrêter. Le pod ne reçoit
          # plus de nouvelle requête, mais finit celles en cours.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 8"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          # Tant que PostgreSQL est injoignable, le pod ne reçoit pas de trafic.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: metier-service
  namespace: indicateurs
spec:
  # ClusterIP : le métier n'est JAMAIS exposé hors du cluster.
  # L'accès extérieur se fait uniquement via le Gateway (règle S4).
  type: ClusterIP
  selector:
    app: metier-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
