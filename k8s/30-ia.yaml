apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-service
  namespace: indicateurs
  labels:
    app: ia-service
spec:
  replicas: 1
  strategy:
    # maxUnavailable 0 : un nouveau pod doit être PRÊT avant qu'un ancien
    # disparaisse. Sans cela, un redéploiement peut réduire temporairement la
    # capacité et provoquer des refus de connexion sous charge.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ia-service
  template:
    metadata:
      labels:
        app: ia-service
    spec:
      # Doit dépasser la durée du preStop, sinon Kubernetes tue le pod
      # avant qu'il ait fini de se retirer proprement.
      terminationGracePeriodSeconds: 30
      containers:
        - name: ia
          image: indicateurs/ia:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # L'IA lit les indicateurs via le service métier (HTTP interne),
            # jamais via une connexion PostgreSQL directe.
            - name: MetierServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: plateforme-config
                  key: IA_METIER_URL
            - name: Ollama__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: plateforme-config
                  key: OLLAMA_BASE_URL
            - name: Ollama__Model
              valueFrom:
                configMapKeyRef:
                  name: plateforme-config
                  key: OLLAMA_MODEL
            - name: Ollama__TimeoutSeconds
              valueFrom:
                configMapKeyRef:
                  name: plateforme-config
                  key: OLLAMA_TIMEOUT_SECONDS
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          # Arrêt en douceur. Sans ce délai, Kubernetes retire le pod des
          # endpoints du Service ET le termine quasi simultanément : les
          # connexions déjà ouvertes sont coupées net. Mesuré avant
          # correction : 4 erreurs sur 381 113 requêtes pendant la suppression
          # d'un pod sous charge.
          #
          # Le preStop laisse le temps à kube-proxy de propager le retrait
          # avant que le processus ne commence à s'arrêter. Le pod ne reçoit
          # plus de nouvelle requête, mais finit celles en cours.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 8"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            # Tant qu'Ollama n'a pas fini de démarrer / de charger le modèle,
            # le pod IA n'est pas déclaré prêt.
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ia-service
  namespace: indicateurs
spec:
  # ClusterIP : l'IA n'est atteignable que par le Gateway.
  type: ClusterIP
  selector:
    app: ia-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
