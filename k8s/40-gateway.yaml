apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: indicateurs
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: indicateurs/gateway:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: MetierServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: plateforme-config
                  key: METIER_SERVICE_URL
            - name: IaServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: plateforme-config
                  key: IA_SERVICE_URL
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            # Volontairement /health et non /health/plateforme : le Gateway doit
            # rester joignable pour diagnostiquer une panne du métier ou de l'IA.
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: indicateurs
spec:
  # NodePort : permet les tests curl depuis l'extérieur (semaines 3 à 5).
  # Le frontend, lui, passe par le nom interne « gateway ».
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30169
      protocol: TCP
