apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: indicateurs
  labels:
    app: gateway
spec:
  replicas: 2
  strategy:
    # maxUnavailable 0 : un nouveau pod doit être PRÊT avant qu'un ancien
    # disparaisse. Sans cela, un redéploiement peut réduire temporairement la
    # capacité et provoquer des refus de connexion sous charge.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Doit dépasser la durée du preStop, sinon Kubernetes tue le pod
      # avant qu'il ait fini de se retirer proprement.
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: indicateurs/gateway:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: MetierServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: plateforme-config
                  key: METIER_SERVICE_URL
            - name: IaServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: plateforme-config
                  key: IA_SERVICE_URL
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          # Arrêt en douceur. Sans ce délai, Kubernetes retire le pod des
          # endpoints du Service ET le termine quasi simultanément : les
          # connexions déjà ouvertes sont coupées net. Mesuré avant
          # correction : 4 erreurs sur 381 113 requêtes pendant la suppression
          # d'un pod sous charge.
          #
          # Le preStop laisse le temps à kube-proxy de propager le retrait
          # avant que le processus ne commence à s'arrêter. Le pod ne reçoit
          # plus de nouvelle requête, mais finit celles en cours.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 8"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            # Volontairement /health et non /health/plateforme : le Gateway doit
            # rester joignable pour diagnostiquer une panne du métier ou de l'IA.
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: indicateurs
spec:
  # NodePort : permet les tests curl depuis l'extérieur (semaines 3 à 5).
  # Le frontend, lui, passe par le nom interne « gateway ».
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30169
      protocol: TCP
