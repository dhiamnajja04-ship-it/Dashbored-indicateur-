# =====================================================================
# Répartiteur de charge devant les répliques du Gateway.
#
# Le Gateway est le point d'entrée unique des API : sa panne coupe tout.
# Le répliquer et placer un répartiteur devant supprime ce point unique de
# défaillance.
#
# POURQUOI PAS UN BLOC « upstream » CLASSIQUE :
# nginx ne résout les noms d'un bloc upstream QU'AU DÉMARRAGE. Il fige alors
# l'adresse d'une seule réplique et ignore les autres — testé : avec deux
# répliques dont une arrêtée, la moitié des requêtes échouaient.
#
# En passant par une VARIABLE dans proxy_pass, nginx interroge le résolveur à
# chaque requête. Le DNS interne de Docker (127.0.0.11) renvoie alors
# l'ensemble des répliques vivantes, en alternant l'ordre : la répartition et
# le basculement deviennent réels.
# =====================================================================

server {
    listen 80;
    server_name _;

    # Résolveur interne de Docker. « valid=5s » borne la mise en cache : une
    # réplique qui disparaît cesse d'être sollicitée au bout de 5 secondes.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    add_header X-Repartiteur "nginx" always;

    location / {
        # La variable est indispensable : sans elle, pas de résolution par requête.
        set $cible_gateway gateway;
        proxy_pass http://$cible_gateway:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une génération IA sur CPU dure jusqu'à une minute : le répartiteur ne
        # doit pas couper avant le Gateway.
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Si la réplique choisie est morte, on rejoue sur une autre.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 20s;
    }

    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "repartiteur actif\n";
    }
}
