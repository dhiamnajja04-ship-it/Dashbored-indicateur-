server {
    listen 80;
    server_name _;

    # Résolveur interne de Docker. Sans lui, nginx résout « loadbalancer » une
    # seule fois au démarrage et fige son adresse. Dès que le conteneur est
    # recréé, il change d'IP et le frontend renvoie 502 en boucle — c'est
    # exactement ce qui est arrivé après l'ajout du répartiteur.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    root /usr/share/nginx/html;
    index index.html;

    # Application Angular : toute route inconnue retombe sur index.html
    # (sinon un rafraîchissement sur /indicateurs/3 renverrait un 404).
    # Les fichiers produits par Angular portent un hachage dans leur nom
    # (main-AB12CD34.js) : leur contenu ne change jamais, on peut les garder
    # indefiniment.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # index.html ne doit JAMAIS etre mis en cache : c'est lui qui designe
        # le bundle a charger. Sans cette regle, le navigateur conserve
        # l'ancienne page et continue de demander un bundle perime apres
        # chaque deploiement — l'interface parait alors figee ou cassee.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Toutes les APIs passent par le répartiteur, qui distribue vers les
    # répliques du Gateway. Le frontend ne connaît donc plus qu'un seul nom,
    # et le nombre de répliques peut changer sans le reconstruire.
    location /api/ {
        # La variable force une résolution DNS à chaque requête.
        set $cible_api loadbalancer;
        proxy_pass http://$cible_api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La génération IA sur CPU est lente : sans ces timeouts, nginx couperait
        # la requête à 60 s et le front afficherait une erreur alors que le modèle
        # est encore en train de répondre.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Sonde de santé de la plateforme, pratique en démo.
    location /health/plateforme {
        set $cible_sante loadbalancer;
        proxy_pass http://$cible_sante:80/health/plateforme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
