server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application Angular : toute route inconnue retombe sur index.html
    # (sinon un rafraîchissement sur /indicateurs/3 renverrait un 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Toutes les APIs passent par le Gateway — jamais directement par le métier
    # ou l'IA. « gateway » est le nom du Service Kubernetes.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La génération IA sur CPU est lente : sans ces timeouts, nginx couperait
        # la requête à 60 s et le front afficherait une erreur alors que le modèle
        # est encore en train de répondre.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Sonde de santé de la plateforme, pratique en démo.
    location /health/plateforme {
        proxy_pass http://gateway:8080/health/plateforme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
