<div class="container pb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Indicateurs</h2>
    <button class="btn btn-primary" (click)="ouvrirCreation()">+ Nouvel indicateur</button>
  </div>

  <div *ngIf="loading" class="text-center text-muted py-5">Chargement...</div>
  <div *ngIf="erreur" class="alert alert-danger">{{ erreur }}</div>

  <div class="card shadow-sm border-0 mb-4" *ngIf="afficherFormulaire">
    <div class="card-header bg-dark text-white">
      {{ modeEdition ? "Modifier l'indicateur" : 'Nouvel indicateur' }}
    </div>
    <div class="card-body">
      <div *ngIf="erreurFormulaire" class="alert alert-danger py-2">{{ erreurFormulaire }}</div>
      <form (ngSubmit)="enregistrer()">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Code</label>
            <input class="form-control" name="code" [(ngModel)]="indicateurCourant.code" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input class="form-control" name="nom" [(ngModel)]="indicateurCourant.nom" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">Unité</label>
            <input class="form-control" name="unite" [(ngModel)]="indicateurCourant.unite" required />
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="2" [(ngModel)]="indicateurCourant.description"></textarea>
          </div>
          <div class="col-md-4">
            <label class="form-label">Type de collecte</label>
            <input class="form-control" name="typeCollecte" [(ngModel)]="indicateurCourant.typeCollecte" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Fréquence</label>
            <input class="form-control" name="frequence" [(ngModel)]="indicateurCourant.frequence" placeholder="mensuelle, annuelle..." />
          </div>
          <div class="col-md-4">
            <label class="form-label">Catégorie (id)</label>
            <input type="number" class="form-control" name="categorieId" [(ngModel)]="indicateurCourant.categorieId" />
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-success" [disabled]="enregistrementEnCours">
            {{ enregistrementEnCours ? 'Enregistrement...' : 'Enregistrer' }}
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="annuler()" [disabled]="enregistrementEnCours">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm border-0" *ngIf="!loading && !erreur">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-3">Code</th>
            <th>Nom</th>
            <th>Unité</th>
            <th>Valeurs</th>
            <th class="text-end pe-3">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ind of indicateurs">
            <td class="ps-3">{{ ind.code }}</td>
            <td>{{ ind.nom }}</td>
            <td>{{ ind.unite }}</td>
            <td>{{ (ind.valeursIndicateurs || []).length }}</td>
            <td class="text-end pe-3">
              <a [routerLink]="['/indicateurs', ind.id]" class="btn btn-sm btn-outline-primary me-1">Détails</a>
              <button class="btn btn-sm btn-outline-secondary me-1" (click)="ouvrirEdition(ind)">Modifier</button>
              <button class="btn btn-sm btn-outline-danger" (click)="supprimer(ind)">Supprimer</button>
            </td>
          </tr>
          <tr *ngIf="indicateurs.length === 0">
            <td colspan="5" class="text-center py-4 text-muted">Aucun indicateur pour le moment.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
