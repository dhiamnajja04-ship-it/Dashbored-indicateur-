# =====================================================================
# Intégration continue de la plateforme d'indicateurs.
#
# Deux travaux enchaînés :
#   1. verifier — construit les images, démarre la plateforme et rejoue le
#      scénario métier complet. C'est le garde-fou : la règle centrale du
#      sujet (l'IA ne voit que les valeurs validées) est testée à chaque push.
#   2. publier  — publie les images sur GitHub Container Registry, mais
#      uniquement si l'étape 1 a réussi et hors pull request.
#
# Ollama n'est PAS démarré en CI : le modèle pèse presque un gigaoctet et la
# génération dure une minute. On teste GET /api/ia/contexte, qui construit le
# prompt sans appeler le modèle — c'est justement l'endpoint qui prouve le
# périmètre.
# =====================================================================
name: CI

on:
  push:
    branches: [main, "stagiaire/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRE: ghcr.io

jobs:
  verifier:
    name: Construire et vérifier
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests unitaires des règles métier
        # Exécutés AVANT de construire les images : inutile de démarrer une
        # plateforme si le workflow de validation ou la construction du prompt
        # sont déjà cassés.
        run: |
          dotnet test tests/MetierService.Tests/MetierService.Tests.csproj --nologo
          dotnet test tests/IaService.Tests/IaService.Tests.csproj --nologo

      - name: Construire les images
        run: |
          docker compose build metier-service gateway frontend ia-service

      - name: Démarrer la plateforme (sans le modèle IA)
        run: |
          docker compose up -d postgres metier-service gateway loadbalancer frontend ia-service
          echo "Attente de la disponibilité…"
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:5169/health >/dev/null 2>&1; then
              echo "Plateforme prête après ${i} tentative(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::La plateforme n'a pas démarré dans le délai imparti."
          docker compose ps
          docker compose logs --tail=50
          exit 1

      - name: Vérifier le scénario métier
        run: ./ci/verifier-plateforme.sh http://localhost:5169

      - name: Vérifier que le frontend sert bien l'application
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://localhost:8080/)
          test "$code" = "200" || { echo "::error::Frontend HTTP $code"; exit 1; }
          # Aucune ressource externe : l'interface doit rester complète hors ligne.
          if curl -s http://localhost:8080/ | grep -q "cdn.jsdelivr"; then
            echo "::error::Le frontend référence un CDN externe."
            exit 1
          fi

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail=120

      - name: Arrêter la plateforme
        if: always()
        run: docker compose down -v

  publier:
    name: Publier les images
    needs: verifier
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: metier
            contexte: ./MetierService
          - service: ia
            contexte: ./IaService
          - service: gateway
            contexte: ./GatewayService
          - service: frontend
            contexte: .
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Buildx
        # Indispensable pour cache-from/cache-to : le pilote Docker par défaut
        # ne sait pas exporter de cache, et le travail échouait sur
        # « Cache export is not supported for the docker driver ».
        uses: docker/setup-buildx-action@v3

      - name: Se connecter au registre
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          # Jeton fourni automatiquement par GitHub : aucun secret à créer.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les étiquettes
        id: etiquettes
        run: |
          # Un nom d'image Docker n'accepte pas de séparateur final : chaque
          # segment doit matcher [a-z0-9]+([._-][a-z0-9]+)*. Or le dépôt
          # s'appelle « Dashbored-indicateur- », avec un tiret terminal, et
          # buildx refusait la référence :
          #   invalid tag "ghcr.io/.../dashbored-indicateur-/ia:latest"
          depot=$(echo "${{ github.repository }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[._-]+$//; s#/[._-]+#/#')
          echo "Nom d'image retenu : ${{ env.REGISTRE }}/${depot}/${{ matrix.service }}"
          echo "image=${{ env.REGISTRE }}/${depot}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          push: true
          tags: |
            ${{ steps.etiquettes.outputs.image }}:latest
            ${{ steps.etiquettes.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
